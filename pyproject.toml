[project]
name = "sequoiax-autoplus"
version = "3.0.0"
description = "A 股量化选股系统：7 个确定性策略 + 邮件推送，可跑在 GitHub Actions 上"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.10",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-mock>=3.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
