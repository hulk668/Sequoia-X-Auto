name: Sequoia-X 每日选股

# ── 触发方式 ──────────────────────────────────────────────
# 1) 定时：每周一至周五 11:15 UTC（= 北京时间 19:15，收盘后）
# 2) 手动：Actions 页面点 "Run workflow"，可选是否跳过增量同步
on:
  schedule:
    - cron: '15 11 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_sync:
        description: '跳过 baostock 增量同步（接口不可达时用，只跑策略）'
        type: boolean
        default: false

# 同一时间只跑一个实例，避免两次触发并发写坏数据库
concurrency:
  group: sequoia-x
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Shanghai          # 日志与 date.today() 走北京时间
      DB_PATH: data/sequoia_v2.db
      START_DATE: '2024-01-01'
      # ── 必填：PushPlus 全局推送 Token（在仓库 Settings → Secrets 中配置）──
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      # ── 可选：各策略专属 Token；未配置则自动回落到全局 PUSHPLUS_TOKEN ──
      STRATEGY_WEBHOOK_MA_VOLUME: ${{ secrets.STRATEGY_WEBHOOK_MA_VOLUME }}
      STRATEGY_WEBHOOK_TURTLE: ${{ secrets.STRATEGY_WEBHOOK_TURTLE }}
      STRATEGY_WEBHOOK_FLAG: ${{ secrets.STRATEGY_WEBHOOK_FLAG }}
      STRATEGY_WEBHOOK_SHAKEOUT: ${{ secrets.STRATEGY_WEBHOOK_SHAKEOUT }}
      STRATEGY_WEBHOOK_LIMIT_DOWN: ${{ secrets.STRATEGY_WEBHOOK_LIMIT_DOWN }}
      STRATEGY_WEBHOOK_RPS: ${{ secrets.STRATEGY_WEBHOOK_RPS }}
      STRATEGY_WEBHOOK_PRIVATE_PLACEMENT: ${{ secrets.STRATEGY_WEBHOOK_PRIVATE_PLACEMENT }}
      # 手动触发时可勾选跳过增量同步；定时触发下该 input 为空字符串，
      # 配置层会把空串按 False 处理（见 Settings._blank_bool_is_false）
      SKIP_SYNC: ${{ github.event.inputs.skip_sync }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 防止把真实 token 误提交进仓库（仓库是公开的）。
      # PushPlus 的 token 是 32 位十六进制串，正常代码/文档里不应出现这种形态；
      # \b 边界保证不会误伤 uv.lock 里 64 位的 sha256。
      - name: 检查是否误提交密钥
        run: |
          hits=$(git grep -nIE '\b[0-9a-fA-F]{32}\b' -- . ':(exclude)data/seed' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::检测到疑似 token 被提交进仓库。请立即把该值改为占位符，并到对应平台重置这个 token。"
            exit 1
          fi
          echo "未发现疑似密钥 ✓"

      # 最先校验推送 Token：未配置的 Secret 会以"空字符串"形式注入，
      # 不拦的话要等跑完全部策略、在推送阶段才会失败，白费几分钟。
      - name: 校验推送 Token
        run: |
          if [ -z "${PUSHPLUS_TOKEN}" ]; then
            echo "::error::PUSHPLUS_TOKEN 为空。请到仓库 Settings → Secrets and variables → Actions → New repository secret，新增名为 PUSHPLUS_TOKEN 的 secret。"
            exit 1
          fi
          echo "PUSHPLUS_TOKEN 已配置（长度 ${#PUSHPLUS_TOKEN}，值已由 GitHub 自动脱敏）"

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # 数据库 117MB，超过 GitHub 单文件 100MB 限制且被 .gitignore 排除，
      # 因此用滚动缓存持久化：restore-keys 命中最近一次，key 用 run_id 保证每轮都保存新副本。
      # key 里带上种子文件的哈希：种子一更新（换了新版数据库）哈希就变，
      # 旧缓存自动不再匹配 → 自动改用新种子重新引导，无需手工清理 Caches。
      - name: 恢复数据库缓存
        uses: actions/cache@v4
        with:
          path: data/sequoia_v2.db
          key: sequoia-db-${{ hashFiles('data/seed/sequoia_v2.db.gz') }}-${{ github.run_id }}
          restore-keys: |
            sequoia-db-${{ hashFiles('data/seed/sequoia_v2.db.gz') }}-

      # 缓存未命中时（首次运行 / 缓存被 GitHub 清理），从仓库内的 gzip 种子引导出初始数据库。
      # 种子文件与生成方式见 data/seed/README.md
      - name: 缓存未命中则从种子引导数据库
        run: |
          if [ -f data/sequoia_v2.db ]; then
            echo "缓存已命中（$(du -h data/sequoia_v2.db | cut -f1)），跳过种子引导"
            exit 0
          fi
          if [ ! -f data/seed/sequoia_v2.db.gz ]; then
            echo "::error::缓存为空，且种子文件 data/seed/sequoia_v2.db.gz 不存在，无法初始化数据库。"
            exit 1
          fi
          mkdir -p data
          gunzip -c data/seed/sequoia_v2.db.gz > data/sequoia_v2.db
          echo "已从种子引导数据库：$(du -h data/sequoia_v2.db | cut -f1)"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare baostock "pydantic-settings>=2.0" python-dotenv rich pandas requests

      # 已移除自动回填（回填接口数据仍有问题）。数据库来源 = 缓存 或 种子引导，
      # 这里做最后一道兜底校验，避免"跑绿了但什么都没选出来"的假成功。
      - name: 检查数据库
        run: |
          if [ ! -f data/sequoia_v2.db ]; then
            echo "::error::未找到 data/sequoia_v2.db：缓存恢复与种子引导均未产生数据库。"
            exit 1
          fi
          ROWS=$(python -c "import sqlite3;print(sqlite3.connect('data/sequoia_v2.db').execute('SELECT COUNT(*) FROM stock_daily').fetchone()[0])" 2>/dev/null || echo 0)
          echo "数据库现有 $ROWS 行"
          if [ "$ROWS" = "0" ]; then
            echo "::error::数据库为空，无法执行增量选股。请检查 data/seed/sequoia_v2.db.gz。"
            exit 1
          fi

      - name: 日常选股并推送
        run: python main.py

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sequoia-log-${{ github.run_id }}
          path: |
            *.log
            data/*.db
          if-no-files-found: ignore
          retention-days: 7
