name: Sequoia-X 每日选股

# ── 触发方式 ──────────────────────────────────────────────
# 1) 定时：每周一至周五 10:30 UTC（= 北京时间 18:30，收盘后）
#    ⚠️ GitHub 的 cron 一律按 UTC 计算，TZ 环境变量只影响进程内的 date.today()，
#    不影响调度时刻。北京时间 18:30 = UTC 10:30。
# 2) 手动：Actions 页面点 "Run workflow"，可选择数据更新方式
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      prefer_akshare:
        description: '用 akshare 更新数据（默认开；关掉则改试 baostock）'
        type: boolean
        default: true
      skip_sync:
        description: '完全不更新数据，直接用库中现有数据跑策略'
        type: boolean
        default: false

# 同一时间只跑一个实例，避免两次触发并发写坏数据库
concurrency:
  group: sequoia-x
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Shanghai          # 日志与 date.today() 走北京时间
      DB_PATH: data/sequoia_v2.db
      START_DATE: '2024-01-01'
      # ── 必填：PushPlus 全局推送 Token（在仓库 Settings → Secrets 中配置）──
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      # ── 可选：各策略专属 Token；未配置则自动回落到全局 PUSHPLUS_TOKEN ──
      STRATEGY_WEBHOOK_MA_VOLUME: ${{ secrets.STRATEGY_WEBHOOK_MA_VOLUME }}
      STRATEGY_WEBHOOK_TURTLE: ${{ secrets.STRATEGY_WEBHOOK_TURTLE }}
      STRATEGY_WEBHOOK_FLAG: ${{ secrets.STRATEGY_WEBHOOK_FLAG }}
      STRATEGY_WEBHOOK_SHAKEOUT: ${{ secrets.STRATEGY_WEBHOOK_SHAKEOUT }}
      STRATEGY_WEBHOOK_LIMIT_DOWN: ${{ secrets.STRATEGY_WEBHOOK_LIMIT_DOWN }}
      STRATEGY_WEBHOOK_RPS: ${{ secrets.STRATEGY_WEBHOOK_RPS }}
      STRATEGY_WEBHOOK_PRIVATE_PLACEMENT: ${{ secrets.STRATEGY_WEBHOOK_PRIVATE_PLACEMENT }}
      # 手动触发时可勾选跳过数据更新；定时触发下该 input 为空字符串，
      # 配置层会把空串按 False 处理（见 Settings._blank_bool_is_false）
      SKIP_SYNC: ${{ github.event.inputs.skip_sync }}
      # 数据更新默认走 akshare（baostock 免费服务长期不稳定，先探路再兜底等于白等）。
      # 手动触发时取勾选值；定时触发下 input 为空，回落到 'true'。
      PREFER_AKSHARE: ${{ github.event.inputs.prefer_akshare || 'true' }}
      # ── 冷启动种子（详见 data/seed/README.md）──
      SEED_BARS: '400'                 # 降级补数时每只票保留的 K 线根数
      SEED_FALLBACK_BACKFILL: 'true'   # 取不到 Release 种子时，是否降级为自行补数
      # 全市场股票池下限。行数够多 ≠ 池子完整：库可能只剩沪市主板 1332 只
      # （历史上的残缺种子），这时行数照样上万，但选股覆盖面只有全市场的 1/4。
      # 因此种子的可用性按「股票数」判定，与 seed.yml 保持一致。
      MIN_SYMBOLS: '4000'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 防止把真实 token 误提交进仓库（仓库是公开的）。
      # PushPlus 的 token 是 32 位十六进制串，正常代码/文档里不应出现这种形态；
      # \b 边界保证不会误伤 uv.lock 里 64 位的 sha256。
      - name: 检查是否误提交密钥
        run: |
          hits=$(git grep -nIE '\b[0-9a-fA-F]{32}\b' -- . ':(exclude)data/seed' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::检测到疑似 token 被提交进仓库。请立即把该值改为占位符，并到对应平台重置这个 token。"
            exit 1
          fi
          echo "未发现疑似密钥 ✓"

      # 最先校验推送 Token：未配置的 Secret 会以"空字符串"形式注入，
      # 不拦的话要等跑完全部策略、在推送阶段才会失败，白费几分钟。
      - name: 校验推送 Token
        run: |
          if [ -z "${PUSHPLUS_TOKEN}" ]; then
            echo "::error::PUSHPLUS_TOKEN 为空。请到仓库 Settings → Secrets and variables → Actions → New repository secret，新增名为 PUSHPLUS_TOKEN 的 secret。"
            exit 1
          fi
          echo "PUSHPLUS_TOKEN 已配置（长度 ${#PUSHPLUS_TOKEN}，值已由 GitHub 自动脱敏）"

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # 先装依赖再碰数据库：因为下面「取不到种子」时要降级到 `main.py --backfill`，
      # 那条路径依赖 pandas 等包，装晚了就没法兜底。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare baostock "pydantic-settings>=2.0" python-dotenv rich pandas requests

      # 数据库 300MB+，远超 GitHub 单文件 100MB 限制，因此用滚动缓存持久化：
      # restore-keys 命中最近一次，key 用 run_id 保证每轮都保存新副本。
      #
      # key 里带上 data/seed/VERSION 的哈希（而不是种子文件本身的哈希）：
      # 种子放在 GitHub Release 里、平时并不在仓库内，hashFiles 取不到；
      # 而 VERSION 里写着「当前种子对应哪个 Release tag」，发布新种子时它必变
      # → 哈希变 → 旧缓存自动不再匹配 → 自动改用新种子重新引导，无需手工清 Caches。
      - name: 恢复数据库缓存
        uses: actions/cache@v4
        with:
          path: data/sequoia_v2.db
          key: sequoia-db-${{ hashFiles('data/seed/VERSION') }}-${{ github.run_id }}
          restore-keys: |
            sequoia-db-${{ hashFiles('data/seed/VERSION') }}-

      # 缓存未命中时（首次运行 / 缓存被 GitHub 清理），从 GitHub Release 下载种子引导初始数据库。
      # 种子不进仓库：300MB+ 解压后太大，压缩后也到了 76MB，
      # 进仓库会让每次 checkout 都白下载一遍。放 Release 资产则既不占体积、也不影响 clone。
      # 种子内容与发布方式见 data/seed/README.md
      - name: 缓存未命中则从 Release 下载种子
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/sequoia_v2.db ]; then
            echo "缓存已命中（$(du -h data/sequoia_v2.db | cut -f1)），跳过种子引导"
            exit 0
          fi

          TAG="$(tr -d '[:space:]' < data/seed/VERSION)"
          if [ -z "$TAG" ]; then
            echo "::error::data/seed/VERSION 为空，无法确定要下载哪个 Release 种子。"
            exit 1
          fi

          echo "缓存未命中，从 Release '$TAG' 下载种子……"
          mkdir -p data/seed data

          # 下载 + 解压 + 校验串成一条 && 链：任一环失败都算「取不到种子」，
          # 统一走下面的降级路径。写成 if 条件而不是裸命令，
          # 是为了让失败不触发 bash -e 直接中断（那样子就没机会降级了）。
          # 校验用单行 python -c：多行内容顶格会破坏 YAML block scalar 的缩进。
          # 按「股票数 ≥ MIN_SYMBOLS」而不是「行数 > 0」判定：行数够多不等于池子完整。
          if gh release download "$TAG" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --pattern 'sequoia_v2.db.gz' \
                 --dir data/seed --clobber \
             && gunzip -c data/seed/sequoia_v2.db.gz > data/sequoia_v2.db \
             && python -c "import sqlite3,sys,os; c=sqlite3.connect('data/sequoia_v2.db'); n=c.execute('SELECT COUNT(*) FROM stock_daily').fetchone()[0]; s=c.execute('SELECT COUNT(DISTINCT symbol) FROM stock_daily').fetchone()[0]; m=int(os.environ.get('MIN_SYMBOLS','4000')); print(f'种子含 {n} 行 / {s} 只股票（下限 {m}）'); sys.exit(0 if n > 0 and s >= m else 1)"; then
            echo "已从 Release '$TAG' 引导数据库：$(du -h data/sequoia_v2.db | cut -f1)"
            rm -f data/seed/sequoia_v2.db.gz
            exit 0
          fi

          # ── 降级：Release 取不到（或内容坏了）时自己补一个库，别让整轮白跑 ──
          rm -f data/sequoia_v2.db data/seed/sequoia_v2.db.gz
          echo "::warning::无法从 Release '$TAG' 取得可用种子。排查方向："
          echo "::warning::  1) 该 tag 的 Release 是否已创建？见 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          echo "::warning::  2) data/seed/VERSION 里的 tag 是否写错（当前值：$TAG）？"
          echo "::warning::  3) 想重建种子：手动触发「Sequoia-X 发布数据库种子」工作流。"
          echo "::warning::  4) 种子的股票数是否不足 ${MIN_SYMBOLS} 只？（残缺种子会被拒绝，见 data/seed/README.md）"

          if [ "${SEED_FALLBACK_BACKFILL}" != "true" ]; then
            echo "::error::已关闭降级补数（SEED_FALLBACK_BACKFILL），终止。"
            exit 1
          fi

          echo "降级：自行补数建立数据库（东财日K → 腾讯兜底）……"
          if ! python main.py --backfill --bars "${SEED_BARS}"; then
            echo "::error::降级补数也失败了。请手动触发「Sequoia-X 发布数据库种子」工作流建好 Release 后重跑。"
            exit 1
          fi
          echo "降级补数完成：$(du -h data/sequoia_v2.db | cut -f1)"

      # 已移除自动回填（回填接口数据仍有问题）。数据库来源 = 缓存 或 Release 种子，
      # 这里做最后一道兜底校验，避免"跑绿了但什么都没选出来"的假成功。
      - name: 检查数据库
        run: |
          if [ ! -f data/sequoia_v2.db ]; then
            echo "::error::未找到 data/sequoia_v2.db：缓存恢复与种子下载均未产生数据库。"
            echo "  请确认 GitHub Release '$(tr -d '[:space:]' < data/seed/VERSION)' 里存在 sequoia_v2.db.gz 资产。"
            echo "  见 https://github.com/${GITHUB_REPOSITORY}/releases"
            exit 1
          fi
          ROWS=$(python -c "import sqlite3;print(sqlite3.connect('data/sequoia_v2.db').execute('SELECT COUNT(*) FROM stock_daily').fetchone()[0])" 2>/dev/null || echo 0)
          SYMBOLS=$(python -c "import sqlite3;print(sqlite3.connect('data/sequoia_v2.db').execute('SELECT COUNT(DISTINCT symbol) FROM stock_daily').fetchone()[0])" 2>/dev/null || echo 0)
          echo "数据库现有 $ROWS 行 / $SYMBOLS 只股票（下限 $MIN_SYMBOLS）"
          if [ "$ROWS" = "0" ]; then
            echo "::error::数据库为空，无法执行增量选股。请检查 Release 里的种子资产是否损坏。"
            exit 1
          fi
          # 兜底：缓存里的库可能退化成残缺池（daily 的增量同步只更新已有的票，
          # 不会把池子扩回来）。与其推出一份只覆盖 1/4 市场的选股结果，
          # 不如响亮地失败 —— 见 data/seed/README.md。
          if [ "$SYMBOLS" -lt "$MIN_SYMBOLS" ]; then
            echo "::error::股票池只有 $SYMBOLS 只，低于下限 $MIN_SYMBOLS —— 拒绝继续（否则选股只覆盖 1/4 市场）。"
            echo "::error::常见原因：Release 里的种子是残缺版本（如 ~22MB / 1332 只）。换个新 tag 重发种子即可，见 data/seed/README.md。"
            exit 1
          fi

      - name: 日常选股并推送
        run: python main.py

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sequoia-log-${{ github.run_id }}
          path: |
            *.log
            data/*.db
          if-no-files-found: ignore
          retention-days: 7
