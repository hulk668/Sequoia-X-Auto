name: Sequoia-X 每日选股

# ── 触发方式 ──────────────────────────────────────────────
# 1) 定时：每周一至周五 11:15 UTC（= 北京时间 19:15，收盘后）
# 2) 手动：Actions 页面点 "Run workflow"，可选 daily / backfill
on:
  schedule:
    - cron: '15 11 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily      # 增量更新 + 跑策略 + 推送
          - backfill   # 全市场历史 K 线回填（首次或补数据用）

# 同一时间只跑一个实例，避免定时与手动触发并发写坏数据库
concurrency:
  group: sequoia-x
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Shanghai          # 日志与 date.today() 走北京时间
      DB_PATH: data/sequoia_v2.db
      START_DATE: '2024-01-01'
      # ── 必填：PushPlus 全局推送 Token（在仓库 Settings → Secrets 中配置）──
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      # ── 可选：各策略专属 Token；未配置则自动回落到全局 PUSHPLUS_TOKEN ──
      STRATEGY_WEBHOOK_MA_VOLUME: ${{ secrets.STRATEGY_WEBHOOK_MA_VOLUME }}
      STRATEGY_WEBHOOK_TURTLE: ${{ secrets.STRATEGY_WEBHOOK_TURTLE }}
      STRATEGY_WEBHOOK_FLAG: ${{ secrets.STRATEGY_WEBHOOK_FLAG }}
      STRATEGY_WEBHOOK_SHAKEOUT: ${{ secrets.STRATEGY_WEBHOOK_SHAKEOUT }}
      STRATEGY_WEBHOOK_LIMIT_DOWN: ${{ secrets.STRATEGY_WEBHOOK_LIMIT_DOWN }}
      STRATEGY_WEBHOOK_RPS: ${{ secrets.STRATEGY_WEBHOOK_RPS }}
      STRATEGY_WEBHOOK_PRIVATE_PLACEMENT: ${{ secrets.STRATEGY_WEBHOOK_PRIVATE_PLACEMENT }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # 数据库 117MB，超过 GitHub 单文件 100MB 限制且被 .gitignore 排除，
      # 因此用滚动缓存持久化：restore-keys 命中最近一次，key 用 run_id 保证每轮都保存新副本。
      - name: 恢复数据库缓存
        uses: actions/cache@v4
        with:
          path: data/sequoia_v2.db
          key: sequoia-db-${{ github.run_id }}
          restore-keys: |
            sequoia-db-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare baostock "pydantic-settings>=2.0" python-dotenv rich pandas requests

      # 缓存未命中（首次运行 / 缓存被清理）时返回 need_backfill=1
      - name: 检查数据库状态
        id: db
        run: |
          if [ -f data/sequoia_v2.db ]; then
            ROWS=$(python -c "import sqlite3;print(sqlite3.connect('data/sequoia_v2.db').execute('SELECT COUNT(*) FROM stock_daily').fetchone()[0])" 2>/dev/null || echo 0)
          else
            ROWS=0
          fi
          case "$ROWS" in
            ''|*[!0-9]*) NEED=1 ;;
            *) [ "$ROWS" -eq 0 ] && NEED=1 || NEED=0 ;;
          esac
          echo "数据库现有 $ROWS 行，need_backfill=$NEED"
          echo "need_backfill=$NEED" >> "$GITHUB_OUTPUT"

      - name: 回填历史数据
        if: steps.db.outputs.need_backfill == '1' || github.event.inputs.mode == 'backfill'
        run: python main.py --backfill

      - name: 日常选股并推送
        if: github.event.inputs.mode != 'backfill'
        run: python main.py

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sequoia-log-${{ github.run_id }}
          path: |
            *.log
            data/*.db
          if-no-files-found: ignore
          retention-days: 7
