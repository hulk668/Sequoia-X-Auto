name: Sequoia-X 发布数据库种子

# ── 用途 ──────────────────────────────────────────────────
# 把「当前最新的数据库」打包成 gzip 种子，发布到 GitHub Release，
# 供 daily 工作流在缓存未命中（首次运行 / 缓存被 GitHub 回收）时冷启动。
#
# 为什么种子放 Release 而不是仓库里：
#   - 解压后 300MB+、压缩后 ~76MB，进仓库会拖慢每一次 checkout，
#     而且超过 50MB 后每次 push 都会收到 GitHub 的大文件警告；
#   - Release 资产不占仓库体积、不影响 clone、单文件上限 2GB。
#
# ── 什么时候需要跑 ──────────────────────────────────────────
# 1. 首次启用：把现有数据库发成种子（tag 用 data/seed/VERSION 的当前值）。
# 2. 想让新机器/新缓存从更新的数据冷启动：换一个**新的 tag**
#    （例如 seed-2026-11-01），工作流会自动更新 VERSION 并提交，
#    哈希一变 → daily 的旧缓存自动失效 → 下轮自动下载新种子。
# 3. 同一个 tag 重发：直接覆盖资产，VERSION 不变，不影响既有缓存。
#
# ── 打包用的库从哪来（按优先级）─────────────────────────────
#   a. 滚动缓存（最近一次，由 daily 日常维护）—— 正常情况走这条
#   b. 缓存被 GitHub 回收时：本仓库 Release 里 VERSION 指向的那个种子
#   c. 连种子都取不到：从零 --backfill（要 runner 能连上东财/腾讯，最不稳）
# 只要 a 或 b 有一个成立，跑本工作流就是全自动的。
# 只有「全新仓库且 Release 里也没有种子」才需要「本机打包 + 网页上传」兜底，
# 见 data/seed/README.md。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空 = 使用 data/seed/VERSION 的当前值，即覆盖重发）'
        type: string
        default: ''
      bars:
        description: '每只票保留最近多少根 K 线（越小种子越小；0 = 不裁剪）'
        type: string
        default: '400'
      backfill_if_empty:
        description: '缓存与种子都取不到时，是否从零补数（关掉则报错退出）'
        type: boolean
        default: true

# 与 daily 共用同一个并发组：两边都会写数据库缓存，串行更安全
concurrency:
  group: sequoia-x
  cancel-in-progress: false

permissions:
  contents: write          # 需要：创建 Release + 提交 VERSION

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Shanghai
      DB_PATH: data/sequoia_v2.db
      START_DATE: '2024-01-01'
      # 本工作流不推送，但 Settings 里 pushplus_token 是必填字段，
      # 缺了会在 get_settings() 直接抛 ValidationError。给个占位值即可。
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || 'seed-workflow-no-push' }}
      # 全市场股票池下限。低于它说明池子残缺（例如只剩沪市主板 1332 只），
      # 打包前必须先补齐 —— 否则会把残缺的库当成"可用种子"发出去。
      MIN_SYMBOLS: '4000'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # 取最近一次滚动缓存 —— 前缀匹配、不看 VERSION 哈希，
      # 因为这里要的就是「当前最新的数据」，而不是「某个种子对应的数据」。
      - name: 恢复数据库缓存（最近一次）
        uses: actions/cache/restore@v4
        with:
          path: data/sequoia_v2.db
          key: sequoia-db-publish-${{ github.run_id }}   # 必定未命中，真正的命中靠 restore-keys
          restore-keys: |
            sequoia-db-

      # 缓存被 GitHub 回收（连续 7 天没跑）时库就不在了。此时**不要**直接去从零补数 ——
      # 仓库 Release 里那个种子就是现成的最佳起点（它本来就是为了冷启动存在的）。
      # 只有连种子都取不到，才退回到下面「确认数据库可用」里的补数路径。
      - name: 缓存未命中则先用现有种子兜底
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          if [ -f data/sequoia_v2.db ]; then
            echo "缓存已恢复（$(du -h data/sequoia_v2.db | cut -f1)），跳过种子兜底"
            exit 0
          fi

          TAG="$(tr -d '[:space:]' < data/seed/VERSION)"
          if [ -z "$TAG" ]; then
            echo "::warning::data/seed/VERSION 为空，无法确定种子 tag，稍后按需从零补数"
            exit 0
          fi

          echo "缓存未命中 → 尝试从现有种子 Release '$TAG' 引导……"
          mkdir -p data/seed
          if gh release download "$TAG" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --pattern 'sequoia_v2.db.gz' \
                 --dir data/seed --clobber \
             && gunzip -c data/seed/sequoia_v2.db.gz > data/sequoia_v2.db; then
            echo "已从 Release '$TAG' 引导数据库：$(du -h data/sequoia_v2.db | cut -f1)"
          else
            rm -f data/sequoia_v2.db
            echo "::warning::从 Release '$TAG' 引导失败，稍后按需从零补数"
          fi
          rm -f data/seed/sequoia_v2.db.gz

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare baostock "pydantic-settings>=2.0" python-dotenv rich pandas requests

      - name: 确认数据库可用（必要时补数）
        run: |
          set -eo pipefail
          BARS="${{ inputs.bars }}"

          if [ -f data/sequoia_v2.db ]; then
            ROWS=$(python -c "import sqlite3;print(sqlite3.connect('data/sequoia_v2.db').execute('SELECT COUNT(*) FROM stock_daily').fetchone()[0])")
            SYMBOLS=$(python -c "import sqlite3;print(sqlite3.connect('data/sequoia_v2.db').execute('SELECT COUNT(DISTINCT symbol) FROM stock_daily').fetchone()[0])")
            echo "缓存里的数据库：$ROWS 行 / $SYMBOLS 只股票（全市场约 5200）"

            # 只看「行数够不够」是不够的 —— 股票池可能退化成只剩沪市主板。
            # daily 的增量同步只更新库里**已有的**股票，永远不会自己把池子扩回来，
            # 所以必须按「股票数」判断：不足就补，否则会打包出一个残缺的种子。
            # （曾经就是这样把 1332 只的库发上了 Release。）
            if [ "$ROWS" -gt 0 ] && [ "$SYMBOLS" -ge "$MIN_SYMBOLS" ]; then
              echo "✓ 股票池已覆盖 $SYMBOLS 只（阈值 $MIN_SYMBOLS），无需补数"
              exit 0
            fi

            if [ "$SYMBOLS" -gt 0 ]; then
              echo "::warning::股票池只有 $SYMBOLS 只，低于阈值 $MIN_SYMBOLS —— 补齐缺失的股票"
            else
              echo "缓存里的数据库是空的，从零补齐"
            fi
          else
            if [ "${{ inputs.backfill_if_empty }}" != "true" ]; then
              echo "::error::缓存与种子都没取到，且本次未勾选自动补数。请勾选后重跑。"
              exit 1
            fi
            echo "缓存与种子都没取到，从零补齐全市场"
          fi

          # backfill 只补「库里一行都没有」的股票，已有的不动 —— 天然幂等：
          # 无论当前池子是 0 只还是 1332 只，跑完都是全市场。
          python main.py --backfill --bars "$BARS"

          # 补完必须复核，避免又把一个残缺的库打包发上 Release
          SYMBOLS=$(python -c "import sqlite3;print(sqlite3.connect('data/sequoia_v2.db').execute('SELECT COUNT(DISTINCT symbol) FROM stock_daily').fetchone()[0])")
          if [ "$SYMBOLS" -lt "$MIN_SYMBOLS" ]; then
            echo "::error::补数后股票数仍只有 $SYMBOLS 只（阈值 $MIN_SYMBOLS）。"
            echo "::error::多半是 runner 连不上东财/腾讯。请改用「本机打包 + 网页上传」：见 data/seed/README.md。"
            exit 1
          fi
          echo "✓ 补数完成，股票池 $SYMBOLS 只"

      - name: 打包种子
        id: pack
        run: |
          set -eo pipefail
          python -u scripts/pack_seed.py --bars "${{ inputs.bars }}" | tee /tmp/pack.log
          grep '^SEED_' /tmp/pack.log >> "$GITHUB_OUTPUT"

      - name: 确定 tag
        id: tag
        run: |
          set -eo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(tr -d '[:space:]' < data/seed/VERSION)"
            echo "未指定 tag，使用 data/seed/VERSION 的当前值：$TAG"
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::tag '$TAG' 含非法字符（只允许字母数字 . _ -）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          ASSET="data/seed/sequoia_v2.db.gz"

          # 单引号 heredoc（<<'EOF'）禁止 shell 展开；正文里的 Actions 表达式
          # 由 Actions 在脚本执行前就替换成字面量了，所以别混用 shell 的 ${VAR} 写法。
          #
          # ⚠️ 注释里也绝不能写 Actions 表达式的定界符（美元符号 + 双大括号）：
          #    GitHub 会扫描整段 run 文本、连注释一起解析，写到一对空定界符会被判定为
          #    「An expression was expected」，整个 workflow 文件直接非法、无法运行。
          NOTES=$(cat <<'EOF'
          Sequoia-X 数据库冷启动种子。

          - 覆盖：${{ steps.pack.outputs.SEED_SYMBOLS }} 只 / ${{ steps.pack.outputs.SEED_ROWS }} 行
          - 体积：${{ steps.pack.outputs.SEED_BYTES }} 字节（gzip -9，解压后 ${{ steps.pack.outputs.SEED_SLIM_BYTES }} 字节）
          - sha256：`${{ steps.pack.outputs.SEED_SHA256 }}`
          - 生成：workflow run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          daily 工作流在缓存未命中时通过 `gh release download` 拉取本资产，
          tag 取自仓库内 `data/seed/VERSION`。用法见 `data/seed/README.md`。
          **请勿删除本 Release 的该资产**，否则缓存被回收后无法冷启动。
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' 已存在 → 覆盖资产"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            echo "Release '$TAG' 不存在 → 新建"
            gh release create "$TAG" "$ASSET" --title "数据库种子 $TAG" --notes "$NOTES"
          fi

          echo "✅ https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"

      # 只有换了新 tag 才需要动 VERSION —— 它一变，daily 的缓存 key 哈希就变，
      # 下一轮自动改用新种子重新引导（这正是"发新种子"的开关）。
      - name: 同步 VERSION（必要时提交）
        run: |
          set -eo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "$(tr -d '[:space:]' < data/seed/VERSION)" = "$TAG" ]; then
            echo "VERSION 已是 $TAG，无需提交（覆盖重发，既有缓存不受影响）"
            exit 0
          fi

          printf '%s\n' "$TAG" > data/seed/VERSION
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 显式列文件，绝不用 git add .（仓库公开，历史上泄露过 token）
          git add data/seed/VERSION
          git commit -m "chore(seed): 种子更新为 $TAG"
          git push
          echo "已把 VERSION 更新为 $TAG 并推送 —— daily 的旧缓存下轮自动失效"

      - name: 汇总
        if: always()
        run: |
          {
            echo "## 种子发布结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| tag | \`${{ steps.tag.outputs.tag }}\` |"
            echo "| 股票数 | ${{ steps.pack.outputs.SEED_SYMBOLS }} |"
            echo "| 行情行数 | ${{ steps.pack.outputs.SEED_ROWS }} |"
            echo "| 压缩后体积 | ${{ steps.pack.outputs.SEED_BYTES }} 字节 |"
            echo "| sha256 | \`${{ steps.pack.outputs.SEED_SHA256 }}\` |"
            echo "| 状态 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seed-publish-log-${{ github.run_id }}
          path: /tmp/pack.log
          if-no-files-found: ignore
          retention-days: 7
